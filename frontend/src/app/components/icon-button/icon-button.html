<button
  class="icon-button"
  [class.icon-button--small]="size === 'small'"
  [class.icon-button--active]="active"
  [attr.aria-label]="label"
  [attr.aria-pressed]="active ? 'true' : null"
  [attr.aria-expanded]="ariaExpanded"
  [title]="label"
  type="button"
  (click)="pressed.emit($event)"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @switch (icon) {
      @case ('menu') {
        <path d="M4 7h16M4 12h16M4 17h16" />
      }
      @case ('undo') {
        <path d="M9 14 4 9l5-5" />
        <path d="M4 9h10a6 6 0 0 1 0 12h-2" />
      }
      @case ('redo') {
        <path d="m15 14 5-5-5-5" />
        <path d="M20 9H10a6 6 0 0 0 0 12h2" />
      }
      @case ('trash') {
        <path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3" />
      }
      @case ('more') {
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      }
      @case ('cursor') {
        <path d="m5 3 14 10-7 1-3 7L5 3Z" />
      }
      @case ('hand') {
        <path
          d="M8 11V5a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6c0 4-2.5 7-6.5 7h-1c-2 0-3.5-1-4.5-2.5L5 14a1.7 1.7 0 0 1 2.5-2.2L9 13"
        />
      }
      @case ('pen') {
        <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" />
        <path d="m14 7 3 3" />
      }
      @case ('shapes') {
        <rect x="3.5" y="4" width="10" height="10" rx="2" />
        <circle cx="16.5" cy="16.5" r="4" />
      }
      @case ('arrow') {
        <path d="M4 18 19 6M10 6h9v9" />
      }
      @case ('text') {
        <path d="M4 6V4h16v2M12 4v16M8 20h8" />
      }
      @case ('sticky') {
        <path d="M5 3h14v12l-5 6H5V3Z" />
        <path d="M14 21v-6h5M8 8h8M8 12h5" />
      }
      @case ('image') {
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="8.5" cy="9" r="1.5" />
        <path d="m21 15-5-5L5 20" />
      }
      @case ('apps') {
        <rect x="4" y="4" width="6" height="6" rx="1" />
        <rect x="14" y="4" width="6" height="6" rx="1" />
        <rect x="4" y="14" width="6" height="6" rx="1" />
        <rect x="14" y="14" width="6" height="6" rx="1" />
      }
    }
  </svg>
</button>
<!--check-->
